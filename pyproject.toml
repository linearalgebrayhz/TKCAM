[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tkcam"
version = "0.1.0"
description = "TKCAM: masked generative modeling of camera trajectories (text/keyframe-conditioned)"
readme = "README.md"
requires-python = ">=3.9"
# Dependencies are installed via environment.yml + requirements.txt (see README); kept out of
# project metadata because requirements.txt contains non-PEP508 lines (e.g. git+ URLs).

[tool.setuptools]
packages = ["tkcam"]
